<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create Post</title>
    <link rel="stylesheet" href="./theme.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">CourtSide</div>
      <nav class="nav">
        <span>Feed</span>
        <span>Create</span>
      </nav>
    </header>

    <main class="page-shell">
      <section class="card form-card">
        <h1>Create a post</h1>
        <form>
          <p><input class="input" value="The kind of game we will remember" /></p>
          <p><select class="select"><option>Game Experience</option></select></p>
          <p><input class="input" value="New York Liberty" /></p>
          <p><textarea class="textarea">The fourth quarter was a masterpiece. It felt like a playoff atmosphere from the opening tip.</textarea></p>
          <button class="button" type="button">Publish</button>
        </form>
      </section>
    </main>
  </body>
</html>
